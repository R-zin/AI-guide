<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">STANDARD FUZZY MEMBERSHIP FUNCTION GEOMETRIES</text>
  
  <!-- 1. Triangular MF -->
  <g transform="translate(50, 60)">
    <rect width="320" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="160" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">1. Triangular MF: tri[a, b, c]</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="280" y2="130" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="45" stroke="#000000" stroke-width="1.5"/>
    <text x="30" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <text x="30" y="135" font-family="Inter, sans-serif" font-size="10" text-anchor="end">0.0</text>
    <!-- Triangle -->
    <polyline points="40,130 80,130 160,50 240,130 280,130" fill="none" stroke="#000000" stroke-width="2"/>
    <line x1="160" y1="50" x2="160" y2="130" stroke="#888888" stroke-dasharray="2,2"/>
    <text x="80" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">a</text>
    <text x="160" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">b</text>
    <text x="240" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">c</text>
  </g>
  
  <!-- 2. Trapezoidal MF -->
  <g transform="translate(430, 60)">
    <rect width="320" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="160" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">2. Trapezoidal MF: trap[a, b, c, d]</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="280" y2="130" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="45" stroke="#000000" stroke-width="1.5"/>
    <text x="30" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <text x="30" y="135" font-family="Inter, sans-serif" font-size="10" text-anchor="end">0.0</text>
    <!-- Trapezoid -->
    <polyline points="40,130 70,130 120,50 200,50 250,130 280,130" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="70" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">a</text>
    <text x="120" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">b</text>
    <text x="200" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">c</text>
    <text x="250" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">d</text>
  </g>
  
  <!-- 3. Gaussian MF -->
  <g transform="translate(50, 250)">
    <rect width="320" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="160" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">3. Gaussian MF: exp(-(x-c)&#178; / 2&#963;&#178;)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="280" y2="130" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="45" stroke="#000000" stroke-width="1.5"/>
    <text x="30" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <!-- Bell Curve -->
    <path d="M 50 130 C 110 130 130 50 160 50 C 190 50 210 130 270 130" fill="none" stroke="#000000" stroke-width="2"/>
    <line x1="160" y1="50" x2="160" y2="130" stroke="#888888" stroke-dasharray="2,2"/>
    <text x="160" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">center (c)</text>
  </g>
  
  <!-- 4. Fuzzy Singleton -->
  <g transform="translate(430, 250)">
    <rect width="320" height="160" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="160" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">4. Fuzzy Singleton (Sugeno Consequent)</text>
    <!-- Axes -->
    <line x1="40" y1="130" x2="280" y2="130" stroke="#000000" stroke-width="1.5"/>
    <line x1="40" y1="130" x2="40" y2="45" stroke="#000000" stroke-width="1.5"/>
    <text x="30" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <!-- Single Spike -->
    <line x1="160" y1="130" x2="160" y2="50" stroke="#000000" stroke-width="3"/>
    <circle cx="160" cy="50" r="4" fill="#000000"/>
    <text x="160" y="145" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">constant k</text>
    <text x="160" y="157" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" fill="#888888">&#956;(x)=1 at k, 0 elsewhere</text>
  </g>
</svg>