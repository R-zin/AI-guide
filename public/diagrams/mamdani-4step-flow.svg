<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">MAMDANI 4-STEP FUZZY INFERENCE ARCHITECTURE</text>
  
  <!-- Step 1: Fuzzification -->
  <rect x="50" y="55" width="700" height="100" fill="#FAFAFA" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="55" width="180" height="25" fill="#000000"/>
  <text x="140" y="72" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STEP 1: FUZZIFICATION</text>
  <text x="70" y="105" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#000000">Convert Crisp Inputs into Fuzzy Membership Degrees:</text>
  <text x="70" y="130" font-family="Inter, sans-serif" font-size="12" fill="#444444">&#8226; Input x&#8321; = 35% (Funding) &#8594; &#956;A1(35) = 0.5, &#956;A2(35) = 0.2, &#956;A3(35) = 0.0</text>
  <text x="420" y="130" font-family="Inter, sans-serif" font-size="12" fill="#444444">&#8226; Input y&#8321; = 60% (Staffing) &#8594; &#956;B1(60) = 0.1, &#956;B2(60) = 0.7</text>
  
  <!-- Down Arrow -->
  <line x1="400" y1="155" x2="400" y2="185" stroke="#000000" stroke-width="2"/>
  <polygon points="400,185 395,175 405,175" fill="#000000"/>
  
  <!-- Step 2: Rule Evaluation -->
  <rect x="50" y="185" width="700" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="185" width="200" height="25" fill="#000000"/>
  <text x="150" y="202" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STEP 2: RULE EVALUATION</text>
  
  <text x="70" y="235" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#000000">Evaluate Antecedents and Apply Firing Strength to Consequents (Clipping / Scaling):</text>
  <text x="70" y="260" font-family="Inter, sans-serif" font-size="12" fill="#000000">Rule 1: IF x is A3 (0.0) OR y is B1 (0.1) THEN z is C1 &#8594; Firing w&#8321; = max(0.0, 0.1) = 0.1 (Clip C1 at 0.1)</text>
  <text x="70" y="285" font-family="Inter, sans-serif" font-size="12" fill="#000000">Rule 2: IF x is A2 (0.2) AND y is B2 (0.7) THEN z is C2 &#8594; Firing w&#8322; = min(0.2, 0.7) = 0.2 (Clip C2 at 0.2)</text>
  <text x="70" y="310" font-family="Inter, sans-serif" font-size="12" fill="#000000">Rule 3: IF x is A1 (0.5) THEN z is C3 &#8594; Firing w&#8323; = 0.5 (Clip C3 at 0.5)</text>
  
  <!-- Down Arrow -->
  <line x1="400" y1="335" x2="400" y2="365" stroke="#000000" stroke-width="2"/>
  <polygon points="400,365 395,355 405,355" fill="#000000"/>
  
  <!-- Step 3: Aggregation -->
  <rect x="50" y="365" width="700" height="95" fill="#FAFAFA" stroke="#000000" stroke-width="1.5"/>
  <rect x="50" y="365" width="260" height="25" fill="#000000"/>
  <text x="180" y="382" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STEP 3: CONSEQUENT AGGREGATION</text>
  <text x="70" y="415" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#000000">Unify Output Sets via Max/Union: &#956;agg(z) = max[&#956;C1(z), &#956;C2(z), &#956;C3(z)]</text>
  <text x="70" y="440" font-family="Inter, sans-serif" font-size="12" fill="#444444">Produces a single composite geometric fuzzy area spanning universe Z [0, 100].</text>
  
  <!-- Down Arrow -->
  <line x1="400" y1="460" x2="400" y2="490" stroke="#000000" stroke-width="2"/>
  <polygon points="400,490 395,480 405,480" fill="#000000"/>
  
  <!-- Step 4: Defuzzification -->
  <rect x="50" y="490" width="700" height="105" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <rect x="50" y="490" width="200" height="25" fill="#000000"/>
  <text x="150" y="507" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STEP 4: DEFUZZIFICATION</text>
  <text x="70" y="535" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#000000">Compute Centroid / Center of Gravity (COG):</text>
  <text x="70" y="560" font-family="JetBrains Mono, monospace" font-size="12" fill="#000000">COG = &#8747; &#956;(z)&#183;z dz / &#8747; &#956;(z) dz  &#8776;  &#8721; (z&#183;&#956;(z)) / &#8721; &#956;(z)</text>
  <text x="70" y="583" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#000000">Result: z* = 67.4% (Crisp Project Risk Output)</text>
</svg>