<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="375" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">MAMDANI CENTROID / CENTER OF GRAVITY (COG) SAMPLE APPROXIMATION</text>
  
  <!-- Graph axes -->
  <line x1="80" y1="260" x2="680" y2="260" stroke="#000000" stroke-width="1.5"/>
  <line x1="80" y1="260" x2="80" y2="60" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Y-axis ticks -->
  <text x="70" y="265" font-family="Inter, sans-serif" font-size="11" text-anchor="end">0.0</text>
  <text x="70" y="225" font-family="Inter, sans-serif" font-size="11" text-anchor="end">0.1</text>
  <text x="70" y="185" font-family="Inter, sans-serif" font-size="11" text-anchor="end">0.2</text>
  <text x="70" y="105" font-family="Inter, sans-serif" font-size="11" text-anchor="end">0.5</text>
  <text x="70" y="65" font-family="Inter, sans-serif" font-size="11" text-anchor="end">&#956; = 1.0</text>
  
  <!-- Steps curve -->
  <!-- 0 to 20 height 0.1 -->
  <!-- 30 to 60 height 0.2 -->
  <!-- 70 to 100 height 0.5 -->
  <!-- X mapping: 0 -> 100, 100 -> 640. dx = 5.4 per unit -->
  <!-- 0: 100, 10: 154, 20: 208, 30: 262, 40: 316, 50: 370, 60: 424, 70: 478, 80: 532, 90: 586, 100: 640 -->
  <path d="M 100 260 L 100 220 L 235 220 L 235 180 L 450 180 L 450 100 L 640 100 L 640 260 Z" fill="#E5E5E5" stroke="#000000" stroke-width="2"/>
  
  <!-- Samples dots -->
  <circle cx="100" cy="220" r="4" fill="#000000"/><text x="100" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">0</text>
  <circle cx="154" cy="220" r="4" fill="#000000"/><text x="154" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">10</text>
  <circle cx="208" cy="220" r="4" fill="#000000"/><text x="208" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">20</text>
  
  <circle cx="262" cy="180" r="4" fill="#000000"/><text x="262" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">30</text>
  <circle cx="316" cy="180" r="4" fill="#000000"/><text x="316" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">40</text>
  <circle cx="370" cy="180" r="4" fill="#000000"/><text x="370" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">50</text>
  <circle cx="424" cy="180" r="4" fill="#000000"/><text x="424" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">60</text>
  
  <circle cx="478" cy="100" r="4" fill="#000000"/><text x="478" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">70</text>
  <circle cx="532" cy="100" r="4" fill="#000000"/><text x="532" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">80</text>
  <circle cx="586" cy="100" r="4" fill="#000000"/><text x="586" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">90</text>
  <circle cx="640" cy="100" r="4" fill="#000000"/><text x="640" y="280" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">100</text>
  
  <!-- Centroid vertical line at 67.4 -> 100 + 67.4*5.4 = 464 -->
  <line x1="464" y1="50" x2="464" y2="260" stroke="#000000" stroke-width="2.5" stroke-dasharray="4,4"/>
  <rect x="420" y="45" width="90" height="25" fill="#000000"/>
  <text x="465" y="62" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COG = 67.4%</text>
  
  <text x="375" y="325" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" fill="#000000">COG = [(0+10+20)&#215;0.1 + (30+40+50+60)&#215;0.2 + (70+80+90+100)&#215;0.5] / [3&#215;0.1 + 4&#215;0.2 + 4&#215;0.5] = 209 / 3.1 &#8776; 67.4%</text>
</svg>