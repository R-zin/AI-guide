<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">WORKED CASE STUDY: SUGENO FAN SPEED CONTROLLER</text>
  
  <!-- Left Box: Temperature -->
  <g transform="translate(40, 50)">
    <rect width="340" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="170" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Temperature (&#176;C), universe [0, 40]</text>
    <!-- Axes -->
    <line x1="30" y1="130" x2="310" y2="130" stroke="#000000" stroke-width="1"/>
    <line x1="30" y1="130" x2="30" y2="45" stroke="#000000" stroke-width="1"/>
    <text x="25" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <!-- Cool trap[0,0,18,24] -->
    <polyline points="30,50 140,50 176,130" fill="none" stroke="#888888" stroke-width="1.5"/>
    <!-- Warm tri[22,28,34] -->
    <polyline points="164,130 200,50 236,130" fill="none" stroke="#000000" stroke-width="1.5"/>
    <!-- Hot trap[30,35,40,40] -->
    <polyline points="212,130 242,50 310,50" fill="none" stroke="#444444" stroke-width="1.5"/>
    <!-- Input T=31 line -->
    <line x1="218" y1="45" x2="218" y2="130" stroke="#000000" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="218" y="145" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">T=31&#176;C</text>
    <text x="60" y="160" font-family="Inter, sans-serif" font-size="11" fill="#000000">&#956;Warm(31) = 0.5</text>
    <text x="200" y="160" font-family="Inter, sans-serif" font-size="11" fill="#000000">&#956;Hot(31) = 0.2</text>
  </g>
  
  <!-- Right Box: Humidity -->
  <g transform="translate(420, 50)">
    <rect width="340" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="170" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Relative Humidity (%), universe [0, 100]</text>
    <!-- Axes -->
    <line x1="30" y1="130" x2="310" y2="130" stroke="#000000" stroke-width="1"/>
    <line x1="30" y1="130" x2="30" y2="45" stroke="#000000" stroke-width="1"/>
    <text x="25" y="55" font-family="Inter, sans-serif" font-size="10" text-anchor="end">1.0</text>
    <!-- Dry trap[0,0,20,40] -->
    <polyline points="30,50 86,50 142,130" fill="none" stroke="#888888" stroke-width="1.5"/>
    <!-- Normal tri[35,55,75] -->
    <polyline points="128,130 184,50 240,130" fill="none" stroke="#000000" stroke-width="1.5"/>
    <!-- Humid trap[65,80,100,100] -->
    <polyline points="212,130 254,50 310,50" fill="none" stroke="#444444" stroke-width="1.5"/>
    <!-- Input H=70 line -->
    <line x1="226" y1="45" x2="226" y2="130" stroke="#000000" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="226" y="145" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">H=70%</text>
    <text x="60" y="160" font-family="Inter, sans-serif" font-size="11" fill="#000000">&#956;Normal(70) = 0.25</text>
    <text x="200" y="160" font-family="Inter, sans-serif" font-size="11" fill="#000000">&#956;Humid(70) = 0.33</text>
  </g>
  
  <!-- Bottom Rules & Defuzzification Summary -->
  <g transform="translate(40, 240)">
    <rect width="720" height="215" fill="#FAFAFA" stroke="#000000" stroke-width="2"/>
    <text x="20" y="25" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#000000">Rule Evaluation (min) &amp; Weighted Average Defuzzification:</text>
    <text x="20" y="55" font-family="Inter, sans-serif" font-size="11" fill="#444444">R1: Cool AND Dry &#8594; min(0, 0) = 0 [Low = 10]</text>
    <text x="20" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#000000">R2: Warm AND Normal &#8594; min(0.5, 0.25) = 0.25 [Medium = 50]  (FIRES)</text>
    <text x="20" y="95" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#000000">R3: Hot AND Humid &#8594; min(0.2, 0.33) = 0.20 [High = 90]  (FIRES)</text>
    <text x="20" y="115" font-family="Inter, sans-serif" font-size="11" fill="#444444">R4: Hot AND Dry &#8594; min(0.2, 0) = 0 [Medium = 50]</text>
    <text x="20" y="135" font-family="Inter, sans-serif" font-size="11" fill="#444444">R5: Cool AND Humid &#8594; min(0, 0.33) = 0 [Medium = 50]</text>
    
    <line x1="20" y1="150" x2="700" y2="150" stroke="#000000" stroke-width="1"/>
    
    <text x="20" y="175" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#000000">z = &#8721;(w&#183;k) / &#8721;w = (0.25 &#215; 50 + 0.20 &#215; 90) / (0.25 + 0.20)</text>
    <text x="20" y="200" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#000000">  = (12.5 + 18.0) / 0.45 = 30.5 / 0.45 &#8776; 67.78% (Fan Speed)</text>
  </g>
</svg>