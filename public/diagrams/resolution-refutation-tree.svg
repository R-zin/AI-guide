<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="300" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#000000">RESOLUTION REFUTATION TREE</text>
  
  <!-- Top Pair -->
  <text x="120" y="70" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;P &#8744; &#172;Q &#8744; R</text>
  <text x="380" y="70" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;R</text>
  
  <line x1="170" y1="80" x2="260" y2="130" stroke="#000000" stroke-width="1.5"/>
  <line x1="380" y1="80" x2="280" y2="130" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Level 1 Resolvent -->
  <text x="230" y="145" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;P &#8744; &#172;Q</text>
  <text x="440" y="145" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">P</text>
  
  <line x1="270" y1="155" x2="350" y2="205" stroke="#000000" stroke-width="1.5"/>
  <line x1="440" y1="155" x2="370" y2="205" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Level 2 Resolvent -->
  <text x="140" y="220" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;T &#8744; Q</text>
  <text x="350" y="220" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;Q</text>
  
  <line x1="190" y1="230" x2="270" y2="280" stroke="#000000" stroke-width="1.5"/>
  <line x1="350" y1="230" x2="290" y2="280" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Level 3 Resolvent -->
  <text x="260" y="295" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">&#172;T</text>
  <text x="420" y="295" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#000000">T</text>
  
  <line x1="270" y1="305" x2="340" y2="350" stroke="#000000" stroke-width="1.5"/>
  <line x1="420" y1="305" x2="360" y2="350" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Empty Clause Box -->
